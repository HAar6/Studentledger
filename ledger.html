    <script>
      (function () {
        try {
          const licRaw = localStorage.getItem("software_license");
          let isLicensed = false;
          if (licRaw) {
            const lic = JSON.parse(licRaw);
            if (lic && (lic.status === "active" || lic.plan)) {
              if (lic.expiresAt && new Date() > new Date(lic.expiresAt)) {
                isLicensed = false;
              } else {
                isLicensed = true;
              }
            }
          }
          if (!isLicensed) {
            window.location.replace("payment.html?plan=monthly&notice=paywall_required");
          }
        } catch (e) {
          window.location.replace("payment.html?plan=monthly&notice=paywall_required");
        }
      })();

            z-index: 9;
        }

        .brand {
            font:
                700 22px Georgia,
                serif;
            padding: 0 8px;
        }

        .brand small {
            display: block;
            font:
                600 9px ui-monospace,
                monospace;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: #a9c0b2;

        }

        .nav {

            gap: 4px;
            margin-top: 22px;

        .nav button {

            background: none;
            color: #d6e0d8;

            padding: 10px;

        }

        .side h5 {
            font:
                700 9px ui-monospace,
                monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #8eaa9a;
            margin: 22px 9px 8px;
        }

        .mini {
            display: flex;
            justify-content: space-between;
            padding: 6px 9px;
            border-left: 2px solid #547565;
            color: #c9d6ce;

        .side-actions {

            padding-top: 20px;

            gap: 6px;

        .side-actions button,

            background: none;
            color: #e1e8e2;

        .link {

        .save-note {

                monospace;
            color: #9eb3a6;
            line-height: 1.4;
            margin: 8px 2px;
        }

        .main {
            margin-left: 250px;
            padding: 28px 34px 60px;
            width: calc(100% - 250px);
            max-width: 1500px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title {
            font:
                700 28px Georgia,
                serif;
        }

        .sub {
            font:
                10px ui-monospace,
                monospace;
            color: var(--muted);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .date {
            font:
                10px ui-monospace,
                monospace;
            background: var(--green);
            color: #fff;
            padding: 9px 12px;
            border-radius: 5px;
        }

        .grid {
            display: grid;
            gap: 15px;
        }

        .stats {
            grid-template-columns: repeat(5, 1fr);
            margin-bottom: 18px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 7px;
            padding: 16px;
            box-shadow: 0 6px 22px rgba(30, 40, 31, 0.07);
        }

        .stat b {
            display: block;
            font:
                700 9px ui-monospace,
                monospace;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .stat strong {
            display: block;
            font:
                700 28px Georgia,
                serif;
            margin: 5px 0;
        }

        .stat small {
            color: var(--muted);
            font-size: 10px;
        }

        .today {
            grid-template-columns: 1fr 1fr 1.3fr;
            margin-bottom: 18px;
        }

        .task {
            min-height: 225px;
            display: flex;
            flex-direction: column;
            border-top: 5px solid var(--blue);
        }

        .task.tax {

        }

        .task.deep {

        }

        .eyebrow {
            font:
                700 9px ui-monospace,
                monospace;
            color: var(--muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .task h3 {
            font:
                700 18px Georgia,
                serif;
            line-height: 1.25;
            margin: 10px 0 5px;
        }

        .meta {
            font:
                10px ui-monospace,
                monospace;
            color: var(--muted);
            line-height: 1.5;
        }

        .target {
            font:
                10px ui-monospace,
                monospace;
            color: var(--green);
            margin: 10px 0;
        }

        .actions {
            margin-top: auto;
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .btn {

            background: var(--green);
            color: #fff;

            border-radius: 4px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover {

        }

        .btn.alt {
            background: transparent;
            color: var(--green);
        }

        .btn.red {
            background: var(--red);
            border-color: #76291f;
        }

        .btn.amber {
            background: var(--amber);
            border-color: #794d0f;
        }

        .btn.small {
            padding: 5px 8px;
            font-size: 9.5px;
        }

        .two {
            grid-template-columns: 1.35fr 1fr;
            margin-bottom: 18px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid var(--ink);

            font:
                700 17px Georgia,

            background: #fbf1d8;
            border-radius: 5px;
            padding: 11px;
            font-size: 10.5px;
            line-height: 1.55;
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 5px;
            padding: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }

        .revlist {
            display: grid;
            gap: 7px;
        }

        .rev {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 9px;
            align-items: center;
            border: 1px solid var(--soft);
            border-left: 4px solid var(--amber);
            background: #fffaf1;
            border-radius: 5px;
            padding: 9px;
        }

        .rev.over {
            border-left-color: var(--red);
        }

        .rev b {
            font-size: 11px;
        }

        .rev small {
            display: block;
            font:
                9px ui-monospace,
                monospace;
            color: var(--muted);
            margin-top: 3px;
        }

        .toolbar {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 13px;
        }

        .field {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 8px;
            border-radius: 4px;
            font-size: 10.5px;
        }

        .toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .subject {
            margin-bottom: 15px;
        }

        .subject-head {
            background: var(--green);
            color: #fff;
            border-radius: 5px 5px 0 0;
            padding: 11px 13px;
            display: flex;
            justify-content: space-between;
        }

        .subject-head h3 {
            font:
                700 14px Georgia,
                serif;
            margin: 0;
        }

        .subject-head span {
            font:
                9px ui-monospace,
                monospace;
        }

        .items {
            border: 1px solid var(--line);
            border-top: 0;
            background: var(--card);
        }

        .item {
            display: grid;
            grid-template-columns: 28px 1fr 90px 80px 90px;
            gap: 8px;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--soft);
        }

        .item:last-child {
            border-bottom: 0;
        }

        .tick {
            width: 19px;
            height: 19px;
            border: 1px solid var(--line);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 9px;
        }

        .tick.done {
            background: var(--green);
            color: #fff;
            border-color: var(--green);
        }

        .item b {
            font-size: 10.5px;
        }

        .item small {
            display: block;
            font:
                8.5px ui-monospace,
                monospace;
            color: var(--muted);
            margin-top: 3px;
        }

        .pill {
            display: inline-block;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 3px 6px;
            font:
                8.5px ui-monospace,
                monospace;
            color: var(--muted);
        }

        .pill.due {
            color: var(--red);
            border-color: #d8aaa3;
            background: #fae7e3;
        }

        .timergrid {
            grid-template-columns: 1.1fr 1fr;
        }

        .timer {
            text-align: center;
        }

        .clock {
            font:
                700 64px ui-monospace,
                monospace;
            color: var(--green);
            letter-spacing: -3px;
            margin: 15px 0;
        }

        .presets {
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .presets button {
            border: 1px solid var(--line);
            background: #f4eedf;
            padding: 6px 9px;
            border-radius: 3px;
            font-size: 9.5px;
            cursor: pointer;
        }

        .presets button.active {
            background: var(--green);
            color: #fff;
        }

        .timer-fields,
        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            text-align: left;
        }

        .timer-fields label,
        .form label,
        .setting label {
            font:
                700 8.5px ui-monospace,
                monospace;
            color: var(--muted);
            text-transform: uppercase;
        }

        .timer-fields .field,
        .form .field,
        .setting .field {
            width: 100%;
            margin-top: 4px;
        }

        .row {
            display: grid;
            grid-template-columns: 82px 1fr 58px auto;
            gap: 7px;
            align-items: center;
            padding: 7px;
            border-bottom: 1px solid var(--soft);
            font-size: 10px;
        }

        .practice {
            grid-template-columns: 0.8fr 1.2fr;
        }

        .wide {
            grid-column: 1/-1;
        }

        .practice-row {
            grid-template-columns: 82px 1fr 70px 60px auto;
        }

        .progress {
            width: 100%;
            border-collapse: collapse;
        }

        .progress th {
            font:
                700 8.5px ui-monospace,
                monospace;
            text-transform: uppercase;
            color: var(--muted);
            text-align: left;
            border-bottom: 2px solid var(--ink);
            padding: 7px;
        }

        .progress td {
            font-size: 10px;
            padding: 8px 7px;
            border-bottom: 1px solid var(--soft);
        }

        .barbox {
            height: 7px;
            background: #e6dfcd;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            background: var(--green);
        }

        .heatmap {
            display: grid;
            grid-template-columns: repeat(30, 1fr);
            gap: 3px;
        }

        .heat {
            aspect-ratio: 1;
            background: #e5dfce;
            border-radius: 2px;
        }

        .h1 {
            background: #bdd2c4;
        }

        .h2 {
            background: #78a087;
        }

        .h3 {
            background: #396c52;
        }

        .h4 {
            background: #153f2f;
        }

        .settings {
            grid-template-columns: 1fr 1fr;
        }

        .setting {
            margin-bottom: 11px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(12, 21, 16, 0.65);
            display: grid;
            place-items: center;
            padding: 18px;
            z-index: 50;
        }

        .modal.hidden {
            display: none;
        }

        .modalbox {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            width: min(520px, 100%);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
        }

        .modalbox h3 {
            font:
                700 21px Georgia,
                serif;
            margin: 0;
        }

        .rating {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 18px 0;
        }

        .rating button {
            width: 52px;
            height: 43px;
            border: 1px solid var(--line);
            background: #f4eedf;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
        }

        .rating button:hover {
            background: var(--green);
            color: #fff;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            background: var(--green);
            color: #fff;
            padding: 9px 13px;
            border-radius: 4px;
            font:
                9px ui-monospace,
                monospace;
            opacity: 0;
            transform: translateY(8px);
            transition: 0.2s;
        }

        .toast.show {
            opacity: 1;
            transform: none;
        }

        @media (max-width: 1050px) {
            .stats {
                grid-template-columns: repeat(3, 1fr);
            }

            .today,
            .two,
            .timergrid,
            .practice,
            .settings {
                grid-template-columns: 1fr;
            }

            .item {
                grid-template-columns: 26px 1fr 82px;
            }

            .item> :nth-child(4),
            .item> :nth-child(5) {
                display: none;
            }
        }

        @media (max-width: 700px) {
            .app {
                display: block;
            }

            .side {
                position: static;
                width: 100%;
            }

            .main {
                margin: 0;
                width: 100%;
                padding: 20px 13px;
            }

            .nav {
                grid-template-columns: repeat(3, 1fr);
            }

            .side h5,
            .mini {
                display: none;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .date {
                display: none;
            }

            .clock {
                font-size: 48px;
            }

            .heatmap {
                grid-template-columns: repeat(15, 1fr);
            }
        }
    </style>
</head>

                    method: "GET",

        function revisionView() {

            );

        function items(k) {

        function clock() {
            return `${String(Math.floor(timer.left / 60)).padStart(2, "0")}:${String(timer.left % 60).padStart(2, "0")}`;
        }
        function timerView() {
            let recent = [...state.sessions]
                .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))

            return (
                header("Study Timer", "completed countdowns post automatically") +
                `<div class="grid timergrid"><div class="card timer"><div class="presets">${[
                    [25, "25 focus"],
                    [50, "50 focus"],
                    [60, "Audit/Tax"],
                    [90, "90 focus"],
                    [240, "4h deep"],
                ]
                    .map(
                        (x) =>
                            `<button data-preset="${x[0]}" class="${timer.preset === x[0] ? "active" : ""}">${x[1]}</button>`
                    )
                    .join(
                        ""
                    )}</div><div class="clock" id="clock">${clock()}</div><div class="actions" style="justify-content:center;margin:12px"><button class="btn" id="timerStart">${timer.running ? "Pause" : "Start"}</button><button class="btn alt" id="timerReset">Reset</button><button class="btn alt" id="timerLog">Log elapsed</button></div><div class="timer-fields"><label>Subject<select class="field" id="timerSubject">${KEYS.map((k) => `<option value="${k}" ${timer.subject === k ? "selected" : ""}>${esc(DATA[k].name)}</option>`).join("")}</select></label><label>Linked item<select class="field" id="timerItem"><option value="">General study</option>${items(
                        timer.subject
                    )
                        .map(
                            (x) =>
                                `<option value="${x.id}" ${timer.item === x.id ? "selected" : ""}>${esc(x.name)}</option>`
                        )
                        .join(
                            ""
                        )}</select></label></div></div><div class="card"><div class="head"><h2>Recent sessions</h2><span>${state.sessions.length} total</span></div>${recent.length ? recent.map((s) => `<div class="row"><span>${fmt(s.date).replace(/ \d{4}/, "")}</span><span>${esc(DATA[s.subject]?.short || "General")}${s.item ? " · " + esc(info(s.item)?.name || "") : ""}</span><strong>${s.minutes}m</strong><button class="btn alt small" data-del-session="${s.id}">×</button></div>`).join("") : `<div class="empty">No sessions logged.</div>`}</div></div>`
            );
        }
        function preset(n) {
            clearInterval(tick);
            timer.preset = n;
            timer.left = n * 60;
            timer.running = false;
            render();
        }
        function toggle() {
            if (timer.running) {
                timer.running = false;
                clearInterval(tick);
                render();
                return;
            }
            timer.running = true;
            tick = setInterval(() => {
                timer.left--;
                let e = document.getElementById("clock");
                if (e) e.textContent = clock();
                if (timer.left <= 0) {
                    clearInterval(tick);
                    timer.running = false;
                    log(timer.preset);

                    alert("Session complete and posted.");
                    render();
                }
            }, 1000);
            render();
        }
        function log(n) {
            n = Math.max(1, Math.round(n));
            state.sessions.push({
                id: uid(),

                minutes: n,
                subject: timer.subject,
                item: timer.item,
            });
            save();
        }
        function elapsed() {
            let n = Math.round((timer.preset * 60 - timer.left) / 60);

            preset(timer.preset);
        }
        function practiceView() {
            let rows = [...state.practice].sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
            return (
                header("Practice & Question Ledger", "ICAI module, RTP, MTP, PYQ and mock practice") +
                `<div class="grid practice"><div class="card"><div class="head"><h2>Post practice</h2><span>one entry</span></div><div class="form"><label>Subject<select class="field" id="pSubject">${KEYS.map((k) => `<option value="${k}">${esc(DATA[k].name)}</option>`).join("")}</select></label><label>Source<select class="field" id="pSource"><option>ICAI Module</option><option>RTP</option><option>MTP</option><option>PYQ</option><option>Question Bank</option><option>Mock Test</option></select></label><label>Questions<input class="field" id="pQ" type="number" min="1" value="10"></label><label>Correct<input class="field" id="pC" type="number" min="0" value="0"></label><label class="wide">Mistakes / notes<textarea class="field" id="pNotes" rows="3"></textarea></label><button class="btn wide" id="addPractice">Post practice</button></div></div><div class="card"><div class="head"><h2>Practice history</h2><span>${rows.reduce((a, b) => a + b.q, 0)} questions</span></div>${rows.length ? rows.map((p) => `<div class="row practice-row"><span>${fmt(p.date).replace(/ \d{4}/, "")}</span><span><strong>${esc(DATA[p.subject]?.short)}</strong> · ${esc(p.source)}<small class="meta">${esc(p.notes || "No notes")}</small></span><span>${p.correct}/${p.q}</span><span>${Math.round((p.correct / p.q) * 100)}%</span><button class="btn alt small" data-del-practice="${p.id}">×</button></div>`).join("") : `<div class="empty">No practice posted.</div>`}</div></div>`
            );
        }
        function analyticsView() {
            let days = [];
            for (let i = 29; i >= 0; i--) {
                let d = add(TODAY(), -i);
                days.push({ d, m: mins(d) });
            }
            let max = Math.max(1, ...days.map((x) => x.m)),
                total = all().length,
                done = Object.values(state.item).filter((x) => x.studiedAt).length,
                revs = Object.values(state.item).reduce((a, b) => a + (b.revisions || 0), 0),
                qs = state.practice.reduce((a, b) => a + b.q, 0);
            return (
                header("Progress Analytics", "coverage, consistency, practice and recall") +
                `<div class="grid stats"><div class="card stat"><b>First coverage</b><strong>${Math.round((done / total) * 100)}%</strong><small>${done}/${total} items</small></div><div class="card stat"><b>Revisions</b><strong>${revs}</strong><small>rated recalls</small></div><div class="card stat"><b>Questions</b><strong>${qs}</strong><small>solved</small></div><div class="card stat"><b>Study hours</b><strong>${(state.sessions.reduce((a, b) => a + b.minutes, 0) / 60).toFixed(1)}</strong><small>timer ledger</small></div><div class="card stat"><b>Streak</b><strong>${streak()}</strong><small>days</small></div></div><div class="card" style="margin-bottom:16px"><div class="head"><h2>Last 30 days</h2><span>darker = more study</span></div><div class="heatmap">${days
                    .map((x) => {
                        let r = x.m / max,
                            c = !x.m ? "" : r < 0.25 ? "h1" : r < 0.5 ? "h2" : r < 0.8 ? "h3" : "h4";
                        return `<div class="heat ${c}" title="${x.d}: ${x.m} minutes"></div>`;
                    })
                    .join(
                        ""
                    )}</div></div><div class="card"><div class="head"><h2>Subject standing</h2><span>first coverage</span></div><table class="progress"><thead><tr><th>Subject</th><th>Stream</th><th>Studied</th><th>Progress</th><th>%</th></tr></thead><tbody>${KEYS.map(
                        (k) => {
                            let c = comp(k);
                            return `<tr><td><strong>${esc(DATA[k].name)}</strong></td><td>${DATA[k].type === "daily" ? "daily topic" : "deep chapter"}</td><td>${c.done}/${c.total}</td><td><div class="barbox"><div class="bar" style="width:${c.pct}%"></div></div></td><td>${c.pct}%</td></tr>`;
                        }
                    ).join("")}</tbody></table></div>`
            );
        }
        function settingsView() {
            return (
                header("Settings & Data Safety", "all data stays on this PC") +
                `<div class="grid settings"><div class="card"><div class="head"><h2>Routine settings</h2><span>minutes</span></div><div class="setting"><label>Exam date<input class="field" id="exam" type="date" value="${state.settings.exam}"></label></div><div class="setting"><label>Audit daily target<input class="field" id="auditMin" type="number" min="10" value="${state.settings.audit}"></label></div><div class="setting"><label>Income Tax daily target<input class="field" id="taxMin" type="number" min="10" value="${state.settings.tax}"></label></div><div class="setting"><label>Deep-work target<input class="field" id="deepMin" type="number" min="30" value="${state.settings.deep}"></label></div><button class="btn" id="saveSettings">Save settings</button></div><div class="card"><div class="head"><h2>Offline storage</h2><span>backup</span></div><div class="notice"><strong>Browser copy:</strong> automatic local storage.<br><strong>PC autosave:</strong> “Link autosave file” works in Chrome/Edge.<br><strong>Portable copy:</strong> export JSON regularly and import it after changing browsers or PCs.</div><div class="actions" style="margin-top:14px"><button class="btn" id="settingsExport">Export JSON</button><button class="btn alt" id="settingsImport">Import JSON</button><button class="btn red" id="reset">Reset all</button></div></div></div>`
            );

        function modal(id) {
            let x = info(id),

        function bind() {
            document.querySelectorAll("[data-view]").forEach(

                (b) =>
                (b.onclick = () => {
                    let x = info(b.dataset.start);
                    timer.subject = x.subject;
                    timer.item = x.id;
                    timer.preset = +b.dataset.min;
                    timer.left = timer.preset * 60;
                    state.view = "timer";
                    render();
                })
            );
            let q = document.getElementById("search");
            if (q)
                q.oninput = () => {
                    search = q.value;
                    render();
                };
            let sf = document.getElementById("subjectFilter");
            if (sf)
                sf.onchange = () => {
                    subjectFilter = sf.value;
                    render();
                };
            let st = document.getElementById("statusFilter");
            if (st)
                st.onchange = () => {
                    statusFilter = st.value;
                    render();
                };

                .querySelectorAll("[data-preset]")

            if (a) a.onclick = toggle;
            let r = document.getElementById("timerReset");
            if (r) r.onclick = () => preset(timer.preset);

            let ts = document.getElementById("timerSubject");
            if (ts)
                ts.onchange = () => {

                    timer.item = "";

            let ti = document.getElementById("timerItem");
            if (ti) ti.onchange = () => (timer.item = ti.value);

                (b.onclick = () => {

                    save();

                    toast();

        async function link() {

        document.addEventListener("keydown", (e) => {

            grid-template-columns: 94px 1fr 72px;
            gap: 9px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dotted var(--soft);
        }

        .subject-meter strong {
            font-size: 10px;
        }

        .subject-meter small {
            font:
                9px ui-monospace,
                monospace;
            color: var(--muted);
            text-align: right;
        }

        .subject-meter .barbox {
            height: 9px;
        }

        .practice-section {
            margin-top: 16px;
        }

        .test-row {
            display: grid;
            grid-template-columns: 78px 1fr 70px 60px auto;
            gap: 7px;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid var(--soft);
            font-size: 10px;
        }

        .day-activity {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .day-activity span {
            border: 1px solid var(--soft);
            background: #faf5e9;
            border-radius: 15px;
            padding: 5px 8px;
            font:
                9px ui-monospace,
                monospace;
        }

        .insight {
            padding: 10px;
            border-left: 3px solid var(--green);
            background: #f4efe1;
            font-size: 10.5px;
            line-height: 1.5;
            margin: 7px 0;
        }

        .insight.warn {
            border-left-color: var(--amber);
        }

        .insight.bad {
            border-left-color: var(--red);
        }

        @media (max-width: 1050px) {

            .analysis-grid,
            .analysis-grid.equal {
                grid-template-columns: 1fr;

            .chapter-box summary {

                        score,
                        max,
                    });
                    save();
                    render();
                };
            document.querySelectorAll("[data-del-test]").forEach(
                (b) =>
                (b.onclick = () => {
                    state.tests = state.tests.filter((x) => x.id !== b.dataset.delTest);
                    save();
                    render();
                })
            );
        };
        ensureExtras();
        render();
    </script>
</body>

</html>
