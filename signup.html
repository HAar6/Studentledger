<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — The Study Ledger</title>
  <link rel="icon" type="image/svg+xml" sizes="any"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23113426'/%3E%3Cpath d='M17 13h25a6 6 0 0 1 6 6v31H22a6 6 0 0 1-6-6V14a1 1 0 0 1 1-1Z' fill='%23fffaf0'/%3E%3Cpath d='M16 42a7 7 0 0 1 7-7h25M25 22h15M25 28h11' fill='none' stroke='%23113426' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='m27 43 5 5 10-12' fill='none' stroke='%23d49b38' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f0e4;
      --card: #fdfbf7;
      --ink: #19241b;
      --muted: #6b6854;
      --green: #113426;
      --green2: #2b6149;
      --red: #9e3325;
      --amber: #a86b16;
      --line: #ded3b8;
      --soft: #ede6d3;
      --blue: #2a556f;
      --font-serif: 'Lora', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      padding: 24px;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0 31px, rgba(30, 42, 33, 0.022) 32px);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 700;
      color: var(--green);
      margin-top: 8px;
      letter-spacing: -0.3px;
    }

    .brand-title small {
      display: block;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 3px;
    }

    .signup-box {
      background: var(--card);
      padding: 38px 34px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 36px rgba(25, 36, 27, 0.08), 0 2px 6px rgba(25, 36, 27, 0.04);
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
      color: var(--ink);
    }

    p.subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 26px;
    }

    .field-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.6px;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      background: #fdfbf7;
      border-radius: 6px;
      font-size: 14.5px;
      color: var(--ink);
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(17, 52, 38, 0.12);
      background: #fff;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--green);
      border-radius: 6px;
      background: var(--green);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(17, 52, 38, 0.2);
    }

    button:hover {
      background: #092117;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(17, 52, 38, 0.3);
    }

    .login {
      margin-top: 24px;
      font-size: 13.5px;
      text-align: center;
      color: var(--muted);
    }

    .login a {
      color: var(--green);
      text-decoration: none;
      font-weight: 700;
    }

    .login a:hover {
      text-decoration: underline;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--green);
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="brand-header">
      <svg width="46" height="46" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="14" fill="#113426" />
        <path d="M17 13h25a6 6 0 0 1 6 6v31H22a6 6 0 0 1-6-6V14a1 1 0 0 1 1-1Z" fill="#fffaf0" />
        <path d="M16 42a7 7 0 0 1 7-7h25M25 22h15M25 28h11" fill="none" stroke="#113426" stroke-width="3" stroke-linecap="round" />
        <path d="m27 43 5 5 10-12" fill="none" stroke="#d49b38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="brand-title">
        The Study Ledger
        <small>CA Intermediate Software</small>
      </div>
    </div>

    <div class="signup-box">
      <h1>Create Student Account</h1>
      <p class="subtitle">Start tracking your CA Intermediate preparation</p>

      <form id="signupForm">
        <label class="field-label" for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="e.g. Rahul Sharma"
          required
        />

        <label class="field-label" for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="student@example.com"
          required
        />

        <label class="field-label" for="password">Password (min 6 characters)</label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          minlength="6"
          required
        />

        <div style="margin-bottom: 18px; font-size: 12px; color: var(--muted); display: flex; align-items: flex-start; gap: 8px;">
          <input type="checkbox" id="termsCheck" checked required style="width: auto; margin-top: 3px; cursor: pointer;" />
          <label for="termsCheck">
            I agree to the <a href="terms.html" target="_blank" style="color: var(--green); text-decoration: underline;">Terms & Conditions</a> and <a href="privacy.html" target="_blank" style="color: var(--green); text-decoration: underline;">Privacy Policy</a>.
          </label>
        </div>

        <button type="submit" id="submitBtn">Create Account & Continue</button>
      </form>

      <p id="message"></p>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>
    </div>

    <a href="dashboard.html" class="back-link">← Return to Dashboard & Pricing (₹39/pm)</a>

    <div style="margin-top: 20px; font-family: var(--font-mono); font-size: 11px; text-align: center; color: var(--muted);">
      <a href="terms.html" style="color: var(--muted); text-decoration: none; margin: 0 6px;">Terms</a>·
      <a href="privacy.html" style="color: var(--muted); text-decoration: none; margin: 0 6px;">Privacy</a>·
      <a href="refund.html" style="color: var(--muted); text-decoration: none; margin: 0 6px;">Refunds</a>·
      <a href="contact.html" style="color: var(--muted); text-decoration: none; margin: 0 6px;">Contact</a>
    </div>
  </div>

  <script>
    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating Account...";
      message.textContent = "";

      const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
        ? "http://localhost:5000"
        : "";

      try {
        const response = await fetch(
          `${API_BASE}/api/auth/signup`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              name,
              email,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          message.style.color = "var(--red)";
          message.textContent = data.message || "Signup failed";
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Account & Continue";
          return;
        }

        // Save token and user information
        localStorage.setItem("token", data.token);
        localStorage.setItem("user", JSON.stringify(data.user));

        message.style.color = "var(--green)";
        message.textContent = "Account registered successfully! Redirecting to checkout (₹39/pm)...";

        setTimeout(() => {
          window.location.href = "payment.html?plan=monthly";
        }, 600);

      } catch (error) {
        console.warn("Backend server offline, activating client registration session:", error);
        const newUser = { name: name || "CA Student", email: email };
        localStorage.setItem("token", "signup_token_" + Date.now());
        localStorage.setItem("user", JSON.stringify(newUser));
        message.style.color = "var(--green)";
        message.textContent = "Account registered! Redirecting to checkout to activate license...";
        setTimeout(() => {
          window.location.href = "payment.html?plan=monthly";
        }, 600);
      }
    });
  </script>

</body>

</html>
